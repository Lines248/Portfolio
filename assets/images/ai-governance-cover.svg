<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d">
  <title id="t">AI governance framework</title>
  <desc id="d">Eleven documents grouped into five areas: policy, training, equity, funding and implementation.</desc>
  <rect width="1600" height="1000" fill="#f3f1ea"/>
  <g font-family="Inter, Helvetica, Arial, sans-serif" fill="#1d2b1f">
    <text x="120" y="190" font-size="40" font-weight="600" letter-spacing="6">AI GOVERNANCE FRAMEWORK</text>
    <text x="120" y="300" font-size="112" font-weight="700" letter-spacing="-3">Rules first.</text>
    <text x="120" y="420" font-size="112" font-weight="700" letter-spacing="-3" fill="#0c7a3e">Then tools.</text>
    <text x="120" y="500" font-size="36" fill="#4a5a4c">11 documents · 5 areas · written for a non-technical team</text>
  </g>
  <g font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#1d2b1f">
    <g transform="translate(120 600)">
      <rect width="250" height="260" rx="6" fill="#ffffff" stroke="#1d2b1f" stroke-width="3"/>
      <text x="28" y="64">Policy</text>
      <rect x="28" y="110" width="160" height="10" fill="#c9d3c4"/><rect x="28" y="140" width="190" height="10" fill="#c9d3c4"/><rect x="28" y="170" width="120" height="10" fill="#c9d3c4"/>
    </g>
    <g transform="translate(400 600)">
      <rect width="250" height="260" rx="6" fill="#ffffff" stroke="#1d2b1f" stroke-width="3"/>
      <text x="28" y="64">Training</text>
      <rect x="28" y="110" width="180" height="10" fill="#c9d3c4"/><rect x="28" y="140" width="140" height="10" fill="#c9d3c4"/><rect x="28" y="170" width="190" height="10" fill="#c9d3c4"/>
    </g>
    <g transform="translate(680 600)">
      <rect width="250" height="260" rx="6" fill="#ffffff" stroke="#1d2b1f" stroke-width="3"/>
      <text x="28" y="64">Equity</text>
      <rect x="28" y="110" width="150" height="10" fill="#c9d3c4"/><rect x="28" y="140" width="190" height="10" fill="#c9d3c4"/><rect x="28" y="170" width="110" height="10" fill="#c9d3c4"/>
    </g>
    <g transform="translate(960 600)">
      <rect width="250" height="260" rx="6" fill="#ffffff" stroke="#1d2b1f" stroke-width="3"/>
      <text x="28" y="64">Funding</text>
      <rect x="28" y="110" width="190" height="10" fill="#c9d3c4"/><rect x="28" y="140" width="130" height="10" fill="#c9d3c4"/><rect x="28" y="170" width="170" height="10" fill="#c9d3c4"/>
    </g>
    <g transform="translate(1240 600)">
      <rect width="250" height="260" rx="6" fill="#0c7a3e" stroke="#0c7a3e" stroke-width="3"/>
      <text x="28" y="64" fill="#ffffff">Rollout</text>
      <rect x="28" y="110" width="170" height="10" fill="#7fbf96"/><rect x="28" y="140" width="190" height="10" fill="#7fbf96"/><rect x="28" y="170" width="140" height="10" fill="#7fbf96"/>
    </g>
  </g>
</svg>
